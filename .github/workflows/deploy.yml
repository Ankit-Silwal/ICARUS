name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and remote environment file to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          cp infra/judge0/judge0.conf.example infra/judge0/judge0.conf
          docker compose --env-file .env.deploy.example \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            config --quiet

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
          test -n "$HEALTHCHECK_URL"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Compose stack
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu; \
            cd '${DEPLOY_PATH}'; \
            git pull --ff-only origin main; \
            test -f '.env.${DEPLOY_ENVIRONMENT}'; \
            test -f 'infra/judge0/judge0.conf'; \
            test -d '/sys/fs/cgroup/memory' || { echo >&2 'Judge0 requires cgroup v1; see docs/DEPLOYMENT.md'; exit 1; }; \
            docker compose --env-file '.env.${DEPLOY_ENVIRONMENT}' \
              -f docker-compose.yml \
              -f docker-compose.deploy.yml \
              up -d --build --remove-orphans; \
            docker compose --env-file '.env.${DEPLOY_ENVIRONMENT}' \
              -f docker-compose.yml \
              -f docker-compose.deploy.yml \
              ps"

      - name: Verify public health endpoint
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 "${HEALTHCHECK_URL%/}/health"
