name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      INTERNAL_SERVICE_TOKEN: ci-only-internal-token-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/icarus
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icarus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d icarus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use repository npm version
        run: npm install --global npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose configuration
        run: |
          cp infra/judge0/judge0.conf.example infra/judge0/judge0.conf
          docker compose config --quiet
          docker compose --env-file .env.deploy.example \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            config --quiet

      - name: Create service databases
        run: >-
          node --input-type=module -e
          "import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          for (const database of ['classroom', 'assessment', 'integrity']) {
            await client.query('CREATE DATABASE ' + database);
          }
          await client.end();"

      - name: Deploy identity migrations
        run: npm run db:deploy --workspace @icarus/identity-service

      - name: Deploy classroom migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classroom
        run: npm run db:deploy --workspace @icarus/classroom-service

      - name: Deploy assessment migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assessment
        run: npm run db:deploy --workspace @icarus/assessment-service

      - name: Deploy integrity migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integrity
        run: npm run db:deploy --workspace @icarus/integrity-service

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run check-types

      - name: Run tests
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build
